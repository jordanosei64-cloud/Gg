<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Snake — Tiny Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101820;
      color: #f3f7f2;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1d3440 0, #101820 60%);
    }
    main { width: min(100%, 480px); }
    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: .08em; }
    .subtitle { margin: 4px 0 0; color: #a9bfbd; }
    .scoreboard { display: flex; justify-content: space-between; margin: 0 2px 10px; font-weight: 700; }
    .scoreboard span { color: #91e6a1; font-variant-numeric: tabular-nums; }
    .board-wrap { position: relative; overflow: hidden; border: 2px solid #416064; border-radius: 14px; box-shadow: 0 18px 55px #0007; }
    canvas { display: block; width: 100%; height: auto; background: #17272b; }
    .message {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 8px;
      padding: 24px; text-align: center; background: #101820d9;
    }
    .message[hidden] { display: none; }
    .message strong { font-size: 1.65rem; }
    .message span { color: #c2d1cb; }
    button {
      border: 0; border-radius: 10px; padding: 11px 18px; background: #91e6a1;
      color: #102019; font: inherit; font-weight: 800; cursor: pointer;
      transition: transform .12s, background .12s;
    }
    button:hover { background: #b0f2bb; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .actions { display: flex; justify-content: center; gap: 10px; margin: 14px 0; }
    .actions button { min-width: 120px; }
    .help { margin: 12px 0; text-align: center; color: #a9bfbd; font-size: .9rem; line-height: 1.6; }
    .pad { display: none; width: 176px; margin: 16px auto 0; grid-template: repeat(2, 52px) / repeat(3, 52px); gap: 6px; }
    .pad button { padding: 0; font-size: 1.35rem; background: #274148; color: #f3f7f2; }
    .pad button:active { background: #416064; }
    .pad .up { grid-area: 1 / 2; }
    .pad .left { grid-area: 2 / 1; }
    .pad .down { grid-area: 2 / 2; }
    .pad .right { grid-area: 2 / 3; }
    @media (pointer: coarse) { .pad { display: grid; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SNAKE</h1>
      <p class="subtitle">A tiny arcade game</p>
    </header>
    <div class="scoreboard" aria-live="polite">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <div class="board-wrap">
      <canvas id="game" width="400" height="400" role="img" aria-label="Snake game board"></canvas>
      <div class="message" id="message">
        <strong id="message-title">Ready?</strong>
        <span id="message-text">Eat the glowing fruit. Don't hit the walls or yourself!</span>
        <button id="start">Play</button>
      </div>
    </div>
    <div class="actions">
      <button id="pause" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
    </div>
    <p class="help">Move with <b>arrow keys</b> or <b>W A S D</b> · <b>Space</b> to pause</p>
    <div class="pad" aria-label="Touch controls">
      <button class="up" data-dir="up" aria-label="Move up">▲</button>
      <button class="left" data-dir="left" aria-label="Move left">◀</button>
      <button class="down" data-dir="down" aria-label="Move down">▼</button>
      <button class="right" data-dir="right" aria-label="Move right">▶</button>
    </div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const bestEl = document.querySelector('#best');
      const message = document.querySelector('#message');
      const title = document.querySelector('#message-title');
      const text = document.querySelector('#message-text');
      const startButton = document.querySelector('#start');
      const cell = 20;
      const cells = canvas.width / cell;
      let snake, direction, nextDirection, food, score, timer, state;
      let best = Number(localStorage.getItem('snake-best') || 0);
      bestEl.textContent = best;

      function placeFood() {
        let spot;
        do {
          spot = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
        } while (snake.some(part => part.x === spot.x && part.y === spot.y));
        return spot;
      }

      function reset() {
        clearInterval(timer);
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = { x: 1, y: 0 };
        nextDirection = { ...direction };
        score = 0;
        scoreEl.textContent = score;
        food = placeFood();
        state = 'ready';
        draw();
        showMessage('Ready?', "Eat the glowing fruit. Don't hit the walls or yourself!", 'Play');
      }

      function showMessage(heading, description, buttonText) {
        title.textContent = heading;
        text.textContent = description;
        startButton.textContent = buttonText;
        message.hidden = false;
      }

      function start() {
        if (state === 'running') return;
        if (state === 'over') reset();
        state = 'running';
        message.hidden = true;
        clearInterval(timer);
        timer = setInterval(tick, Math.max(65, 125 - Math.floor(score / 5) * 5));
      }

      function setDirection(name) {
        if (state === 'ready') start();
        const directions = {
          up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
          left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
        };
        const candidate = directions[name];
        if (candidate && (candidate.x !== -direction.x || candidate.y !== -direction.y)) {
          nextDirection = candidate;
        }
      }

      function tick() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);
        if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
            body.some(part => part.x === head.x && part.y === head.y)) {
          endGame();
          return;
        }
        snake.unshift(head);
        if (eating) {
          score += 1;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('snake-best', best);
          }
          food = placeFood();
          clearInterval(timer);
          timer = setInterval(tick, Math.max(65, 125 - Math.floor(score / 5) * 5));
        } else {
          snake.pop();
        }
        draw();
      }

      function endGame() {
        clearInterval(timer);
        state = 'over';
        showMessage('Game over!', `You scored ${score}. Fancy another round?`, 'Play again');
      }

      function draw() {
        ctx.fillStyle = '#17272b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ffffff0a';
        ctx.lineWidth = 1;
        for (let i = 0; i <= cells; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
        }
        if (!snake) return;
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .34, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? '#b0f2bb' : '#58c878';
          ctx.beginPath();
          ctx.roundRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4, 6);
          ctx.fill();
        });
      }

      function togglePause() {
        if (state === 'running') {
          clearInterval(timer);
          state = 'paused';
          showMessage('Paused', 'Take a breather. Your snake is waiting.', 'Resume');
        } else if (state === 'paused') {
          start();
        }
      }

      document.addEventListener('keydown', event => {
        const keys = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
          ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
        if (keys[event.key]) { event.preventDefault(); setDirection(keys[event.key]); }
        if (event.code === 'Space') { event.preventDefault(); togglePause(); }
      });
      document.querySelectorAll('[data-dir]').forEach(button => {
        button.addEventListener('click', () => setDirection(button.dataset.dir));
      });
      startButton.addEventListener('click', start);
      document.querySelector('#pause').addEventListener('click', togglePause);
      document.querySelector('#restart').addEventListener('click', reset);
      reset();
    })();
  </script>
</body>
</html>
